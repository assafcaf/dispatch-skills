[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dispatch-skills"
version = "0.2.0"
description = "Spec, tickets and parallel test-first implementation for Claude Code, with the issue tracker kept current as agents work"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = ["claude-code", "skills", "dispatch", "agents", "tdd"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/assafcaf/dispatch-skills"

[project.scripts]
dispatch-skills = "dispatch_skills.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["dispatch_skills"]

# The payload lives at the repository root so the bash and npx paths use it directly. A wheel
# has no repository root, so it is copied under the package; cli.py looks there first.
[tool.hatch.build.targets.wheel.force-include]
"install.sh" = "dispatch_skills/payload/install.sh"
"payload" = "dispatch_skills/payload/payload"
"NOTICE" = "dispatch_skills/payload/NOTICE"
